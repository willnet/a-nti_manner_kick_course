name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
        rails-version: ['7.0', '7.1', '7.2', '8.0', '8.1']
        exclude:
          - ruby-version: '3.3'
            rails-version: '7.0'
          - ruby-version: '3.4'
            rails-version: '7.0'
          - ruby-version: '4.0'
            rails-version: '7.0'
          - ruby-version: '3.4'
            rails-version: '7.1'
          - ruby-version: '4.0'
            rails-version: '7.1'
          - ruby-version: '3.0'
            rails-version: '7.2'
          - ruby-version: '3.0'
            rails-version: '8.0'
          - ruby-version: '3.1'
            rails-version: '8.0'
          - ruby-version: '3.0'
            rails-version: '8.1'
          - ruby-version: '3.1'
            rails-version: '8.1'

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y curl sqlite3

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
        env:
          BUNDLE_GEMFILE: gemfiles/Gemfile.rails-${{ matrix.rails-version }}

      - name: Run Unit tests
        env:
          RAILS_ENV: test
          BUNDLE_GEMFILE: gemfiles/Gemfile.rails-${{ matrix.rails-version }}
        run: bin/unit-test

      - name: Run E2E tests
        env:
          RAILS_ENV: test
          BUNDLE_GEMFILE: gemfiles/Gemfile.rails-${{ matrix.rails-version }}
        run: bin/e2e-test


  test-success:
    name: All tests passed
    needs: [lint, test]
    # Always finish this required check, including when a dependency fails or skips.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify required CI results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"
